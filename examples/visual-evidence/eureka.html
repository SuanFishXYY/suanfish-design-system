<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark">
<meta name="description" content="算鱼 · Eureka 欢迎闪现 · 仪式模式视觉证据">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>算鱼 · Eureka 欢迎闪现 · 仪式模式视觉证据</title>
<!--
  算鱼设计系统 · 仪式模式视觉证据
  把 ref 02 Eureka 欢迎闪现的 8 keyframes + 5 层粒子组合渲染成真实可看动画。
  单文件 HTML · 零依赖 · 浏览器直接打开 · 点按钮重放。
  对应 ref: 02 Eureka / 11 动画库 / 46 美学（R-Cross3 张力 + 加减辩证·仪式暖色谱）
-->
<style>
:root {
  --amber-200: #fde68a; --amber-300: #fcd34d; --amber-400: #fbbf24; --amber-500: #f59e0b; --amber-600: #d97706; --amber-700: #b45309;
  --rose-400: #fb7185; --rose-500: #f43f5e; --rose-600: #e11d48;
  --orange-500: #f97316; --orange-600: #ea580c;
  --slate-900: #0f172a; --slate-800: #1e293b; --slate-700: #334155; --slate-600: #475569; --slate-500: #64748b; --slate-400: #94a3b8; --slate-100: #f1f5f9;
  --white: #fff;
  --font: -apple-system, "SF Pro Display", "Helvetica Neue", "PingFang SC", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { -webkit-font-smoothing: antialiased; font-family: var(--font); background: var(--slate-900); color: var(--slate-100); min-height: 100vh; overflow-x: hidden; }
.controls { position: fixed; top: 16px; right: 16px; z-index: 1000; display: flex; gap: 8px; }
.controls button { background: rgba(255,255,255,.1); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.2); color: var(--white); padding: 8px 16px; border-radius: 8px; font-size: 13px; cursor: pointer; transition: all .2s; }
.controls button:hover { background: rgba(255,255,255,.2); }
.info { position: fixed; bottom: 16px; left: 16px; z-index: 1000; background: rgba(0,0,0,.5); backdrop-filter: blur(8px); padding: 12px 16px; border-radius: 12px; font-size: 12px; color: var(--slate-400); max-width: 320px; line-height: 1.6; }
.info strong { color: var(--amber-400); }
.info code { background: rgba(255,255,255,.1); padding: 1px 5px; border-radius: 3px; font-size: 11px; color: var(--amber-300); }

/* === ref 02 §1 Eureka 8 keyframes（仪式专属 onbEureka* 前缀）=== */
@keyframes onbEurekaBackdrop { 0%{opacity:0} 20%{opacity:1} 75%{opacity:1} 100%{opacity:0} }
@keyframes onbEurekaFlash {
  0%{transform:translate(-50%,-50%) scale(0);opacity:0}
  18%{transform:translate(-50%,-50%) scale(6);opacity:1}
  35%{transform:translate(-50%,-50%) scale(2.5);opacity:.5}
  60%{transform:translate(-50%,-50%) scale(1.2);opacity:.25}
  100%{transform:translate(-50%,-50%) scale(1);opacity:0}
}
@keyframes onbEurekaRing {
  0%{opacity:0;transform:translate(-50%,-50%) scale(0)}
  15%{opacity:.85;transform:translate(-50%,-50%) scale(.3)}
  60%{opacity:.35;transform:translate(-50%,-50%) scale(1.8)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(2.6)}
}
@keyframes onbEurekaOrb {
  0%{opacity:0;transform:translate(0,0) scale(.3)}
  25%{opacity:.9;transform:translate(calc(var(--dx)*.45),calc(var(--dy)*.45)) scale(1)}
  70%{opacity:.7;transform:translate(var(--dx),var(--dy)) scale(1.05)}
  100%{opacity:0;transform:translate(calc(var(--dx)*1.2),calc(var(--dy)*1.2)) scale(.8)}
}
@keyframes onbEurekaSpark {
  0%{opacity:0;transform:translate(0,0) scale(0)}
  20%{opacity:1;transform:translate(calc(var(--dx)*.4),calc(var(--dy)*.4)) scale(1.2)}
  60%{opacity:1;transform:translate(var(--dx),var(--dy)) scale(1)}
  100%{opacity:0;transform:translate(calc(var(--dx)*1.3),calc(var(--dy)*1.3)) scale(.3)}
}
@keyframes onbEurekaBulb {
  0%{opacity:0;transform:translateX(-50%) translateY(8px) scale(.4)}
  30%{opacity:1;transform:translateX(-50%) translateY(0) scale(1.2)}
  45%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
  80%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
  100%{opacity:0;transform:translateX(-50%) translateY(-4px) scale(1.1)}
}
@keyframes onbEurekaTitle {
  0%{opacity:0;transform:translateY(8px) scale(.96);filter:blur(8px)}
  35%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
  80%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
  100%{opacity:0;transform:translateY(-4px) scale(1.02);filter:blur(2px)}
}
@keyframes onbEurekaShine {
  0%{opacity:0;transform:translateX(-150%) skewX(-20deg)}
  40%{opacity:.9}
  100%{opacity:0;transform:translateX(150%) skewX(-20deg)}
}

/* === 舞台 === */
.stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; pointer-events: none; }
.stage.playing { animation: onbEurekaBackdrop 2.8s ease-out forwards; }

/* 暖色背景柔光（ref 02 §2 第1层）*/
.warm-glow { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(255,251,235,.92) 0%, rgba(255,247,237,.55) 32%, rgba(255,255,255,0) 72%); }

/* 3 圈同心扩散环（ref 02 §2 第2层）*/
.ring { position: absolute; top: 50%; left: 50%; border-radius: 50%; border-width: 2px; border-style: solid; }
.stage.playing .ring { animation: onbEurekaRing 2.8s cubic-bezier(.16,1,.3,1) forwards; opacity: 0; }
.ring-1 { width: 110px; height: 110px; border-color: rgba(251,191,36,.55); box-shadow: 0 0 24px rgba(251,191,36,.55); animation-delay: .1s; }
.ring-2 { width: 150px; height: 150px; border-color: rgba(244,114,182,.4); box-shadow: 0 0 24px rgba(244,114,182,.4); animation-delay: .28s; }
.ring-3 { width: 190px; height: 190px; border-color: rgba(251,191,36,.3); box-shadow: 0 0 24px rgba(251,191,36,.3); animation-delay: .48s; }

/* 中心闪点（ref 02 §2 第3层）*/
.flash { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; border-radius: 50%; background: radial-gradient(circle, #fff 0%, #fbbf24 40%, transparent 70%); box-shadow: 0 0 50px 14px rgba(251,191,36,.7); }
.stage.playing .flash { animation: onbEurekaFlash 2.8s cubic-bezier(.16,1,.3,1) forwards; }

/* 8 柔光大光球（ref 02 §2 第4层）*/
.orb { position: absolute; top: 50%; left: 50%; border-radius: 50%; filter: blur(6px); opacity: 0; }
.stage.playing .orb { animation: onbEurekaOrb 2.8s cubic-bezier(.16,1,.3,1) forwards; }

/* 20 细小火花（ref 02 §2 第5层）*/
.spark { position: absolute; top: 50%; left: 50%; border-radius: 50%; opacity: 0; }
.stage.playing .spark { animation: onbEurekaSpark 2.8s cubic-bezier(.16,1,.3,1) forwards; }

/* 顶部灯泡气泡（ref 02 §2 第6层）*/
.bulb { position: absolute; top: 50%; left: 50%; transform: translateX(-50%); margin-top: -64px; opacity: 0; }
.stage.playing .bulb { animation: onbEurekaBulb 2.8s cubic-bezier(.16,1,.3,1) forwards; }
.bulb-inner { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--amber-200), var(--amber-300), var(--amber-500)); display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 24px rgba(245,158,11,.55); ring: 1px solid white; }
.bulb-inner::after { content: '✨'; font-size: 20px; }

/* 主标题 Welcome（ref 02 §2 第7层）*/
.title-wrap { position: absolute; top: 50%; left: 50%; transform: translate(-50%, 48px); text-align: center; opacity: 0; }
.stage.playing .title-wrap { animation: onbEurekaTitle 2.8s cubic-bezier(.16,1,.3,1) .18s forwards; }
.title { font-size: clamp(40px, 8vw, 72px); font-weight: 900; letter-spacing: -.02em; line-height: 1; overflow: hidden; position: relative; display: inline-block; }
.title .w { background: linear-gradient(135deg, #475569 0%, #1e293b 60%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.title .p { margin-left: 12px; background: linear-gradient(135deg, #f59e0b 0%, #f43f5e 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.title .bang { background: linear-gradient(135deg, #f43f5e 0%, #f59e0b 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.shine { position: absolute; inset: 0; width: 33%; background: linear-gradient(110deg, transparent 0%, rgba(255,255,255,.85) 50%, transparent 100%); mix-blend-mode: overlay; pointer-events: none; }
.stage.playing .shine { animation: onbEurekaShine 2.8s cubic-bezier(.16,1,.3,1) .6s forwards; opacity: 0; }

/* 静态待播态 */
.stage.idle .warm-glow { opacity: .15; }
.stage.idle .title-wrap { opacity: .3; }
.idle-hint { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--slate-500); font-size: 14px; text-align: center; }
.stage.playing .idle-hint { display: none; }
@media (max-width: 768px) { .wrap{padding:16px} .grid-4,.grid-3,.grid-2,.sages,.notif-grid,.dialectic{grid-template-columns:1fr !important} .three-pane{grid-template-columns:1fr !important;height:auto} .steps{flex-wrap:wrap} .step-pill{flex:1 1 30%} h1{font-size:22px} }
@media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration:80ms !important; animation-iteration-count:1 !important; transition-duration:80ms !important } }
</style>
</head>
<body>

<div class="controls">
  <button onclick="replay()">▶ 重放 Eureka</button>
</div>

<div class="info">
  <strong>算鱼 · Eureka 欢迎闪现</strong> · ref 02 仪式模式视觉证据<br>
  8 keyframes（<code>onbEureka*</code>）+ 5 层粒子组合：暖光底 → 3 圈扩散环 → 中心闪点 → 8 光球 → 20 火花 → 灯泡 → 标题渐变+扫光<br>
  总时长 2.8s · 缓动 <code>cubic-bezier(.16,1,.3,1)</code> · 暖色谱（ref 01 §11 仪式专属）<br>
  R-Cross3 情感张力（ref 46）：首登 = 用户旅程"启程"节点，必须有曲线
</div>

<div class="stage idle" id="stage">
  <div class="warm-glow"></div>

  <!-- 3 圈同心扩散环 -->
  <div class="ring ring-1"></div>
  <div class="ring ring-2"></div>
  <div class="ring ring-3"></div>

  <!-- 中心闪点 -->
  <div class="flash"></div>

  <!-- 8 光球 + 20 火花（JS 生成）-->
  <div id="particles"></div>

  <!-- 灯泡 -->
  <div class="bulb"><div class="bulb-inner"></div></div>

  <!-- 主标题 -->
  <div class="title-wrap">
    <div class="title">
      <span class="w">Welcome</span><span class="p">算鱼</span><span class="bang">!</span>
      <div class="shine"></div>
    </div>
  </div>

  <div class="idle-hint">点击右上角 ▶ 重放 Eureka 启动动画</div>
</div>

<script>
// === ref 02 §2 5 层粒子组合（JS 生成 8 光球 + 20 火花）===
const particles = document.getElementById('particles');
const DUR = 2.8;

// 8 柔光大光球
const orbs = Array.from({length: 8}, (_, i) => {
  const angle = (i / 8) * Math.PI * 2 + 0.4;
  const dist = 160 + (i % 3) * 50;
  return { dx: Math.cos(angle) * dist, dy: Math.sin(angle) * dist, delay: 0.1 + (i % 4) * 0.06, size: 28 + (i % 3) * 10, warm: i % 2 === 0 };
});
orbs.forEach(o => {
  const el = document.createElement('div');
  el.className = 'orb';
  el.style.cssText = `width:${o.size}px;height:${o.size}px;margin:-${o.size/2}px 0 0 -${o.size/2}px;--dx:${o.dx}px;--dy:${o.dy}px;animation-delay:${o.delay}s;background:${o.warm ? 'radial-gradient(circle,rgba(254,243,199,.85) 0%,rgba(251,191,36,.25) 60%,transparent 80%)' : 'radial-gradient(circle,rgba(254,226,226,.8) 0%,rgba(244,114,182,.22) 60%,transparent 80%)'};`;
  particles.appendChild(el);
});

// 20 细小火花
const sparks = Array.from({length: 20}, (_, i) => {
  const angle = (i / 20) * Math.PI * 2 + (i % 2 === 0 ? 0 : 0.16);
  const dist = 80 + (i % 4) * 35;
  return { dx: Math.cos(angle) * dist, dy: Math.sin(angle) * dist, delay: 0.18 + (i % 8) * 0.025, size: 3 + (i % 3), warm: i % 2 === 0 };
});
sparks.forEach(s => {
  const el = document.createElement('div');
  el.className = 'spark';
  const bg = s.warm ? 'radial-gradient(circle,#fde68a,#f59e0b)' : 'radial-gradient(circle,#fecdd3,#f43f5e)';
  const sh = s.warm ? '0 0 8px 2px rgba(251,191,36,.75)' : '0 0 8px 2px rgba(244,63,94,.65)';
  el.style.cssText = `width:${s.size}px;height:${s.size}px;--dx:${s.dx}px;--dy:${s.dy}px;animation-delay:${s.delay}s;background:${bg};box-shadow:${sh};`;
  particles.appendChild(el);
});

// === 重放 ===
const stage = document.getElementById('stage');
function replay() {
  stage.classList.remove('playing');
  stage.classList.add('idle');
  // 强制 reflow 重置动画
  void stage.offsetWidth;
  stage.classList.remove('idle');
  stage.classList.add('playing');
  // 2.8s 后回到 idle
  setTimeout(() => {
    stage.classList.remove('playing');
    stage.classList.add('idle');
  }, DUR * 1000 + 200);
}

// 首次自动播放
setTimeout(replay, 500);
</script>
</body>
</html>
